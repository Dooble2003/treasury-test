[project]
name = "label-check"
version = "0.1.0"
description = "Checks alcohol label images against COLA application data"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "onnxruntime>=1.30.0",
    "opencv-python>=5.0.0.93",
    "pillow>=12.3.0",
    "python-multipart>=0.0.32",
    "rapidfuzz>=3.14.6",
    "rapidocr>=3.9.2",
    "uvicorn[standard]>=0.53.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]
